<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Controle IR</title>
<style>
  :root { --fundo:#0f1115; --cartao:#191c23; --texto:#eef0f4; --suave:#9aa3b2; --borda:#2a2f3a;
          --perigo:#e5484d; --perigo2:#ff6b6f; --ok:#30a46c; --aviso:#f5a524; --acento:#5b8cff; }
  @media (prefers-color-scheme: light) {
    :root { --fundo:#f4f5f8; --cartao:#fff; --texto:#15171c; --suave:#5d6470; --borda:#dfe2e8; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.4 system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:14px; padding:14px; margin-bottom:14px; }
  .linha { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ponto { width:12px; height:12px; border-radius:50%; background:var(--suave); flex:none; }
  .ponto.ok { background:var(--ok); } .ponto.aviso { background:var(--aviso); } .ponto.erro { background:var(--perigo); }
  .suave { color:var(--suave); font-size:14px; }
  button { font:inherit; border-radius:10px; border:1px solid var(--borda); background:transparent; color:var(--texto);
           padding:10px 14px; min-height:44px; }
  button:active { transform:scale(.98); }
  #pausar { width:100%; min-height:96px; font-size:26px; font-weight:700; background:var(--perigo); color:#fff; border:none; border-radius:16px; }
  #pausar:disabled { background:var(--borda); color:var(--suave); }
  .barra { height:10px; background:var(--borda); border-radius:6px; overflow:hidden; margin:10px 0; }
  .barra > div { height:100%; background:var(--acento); width:0; transition:width .3s; }
  .hist { list-style:none; padding:0; margin:10px 0 0; }
  .hist li { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--borda); }
  .hist li .info { flex:1; min-width:0; font-size:14px; }
  .hist li button { padding:6px 10px; min-height:38px; font-size:14px; }
  .teclas { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .teclas button { padding:8px 10px; min-height:40px; font-size:14px; }
  textarea { width:100%; min-height:90px; border-radius:10px; border:1px solid var(--borda); background:transparent; color:var(--texto); padding:10px; font:13px/1.3 ui-monospace, monospace; }
  input[type=range] { flex:1; }
  .grande { font-size:18px; font-weight:600; }
  #msg { position:fixed; left:16px; right:16px; bottom:16px; background:var(--cartao); border:1px solid var(--borda); border-radius:12px; padding:12px; display:none; }
</style>
</head>
<body>
<main>
  <h1>Controle IR do POCO</h1>

  <section class="cartao">
    <h2>Conexão</h2>
    <div class="linha"><span id="p-claude" class="ponto"></span><span id="t-claude">Aguardando o Claude…</span></div>
    <div class="linha" style="margin-top:6px"><span id="p-emissor" class="ponto"></span><span id="t-emissor">Verificando emissor…</span></div>
    <div class="suave" id="t-url" style="margin-top:6px"></div>
  </section>

  <section class="cartao" id="busca">
    <h2>Descoberta</h2>
    <div id="t-busca" class="grande">Nenhuma busca em andamento.</div>
    <div class="suave" id="t-atual"></div>
    <div class="barra"><div id="barra"></div></div>
    <button id="pausar" disabled>Reagiu — pausar</button>
    <div class="linha" style="margin-top:10px">
      <button id="continuar">Continuar</button>
      <span class="suave">Intervalo</span>
      <input id="intervalo" type="range" min="2" max="30" step="1" value="8">
      <span id="t-intervalo">8 s</span>
    </div>
    <ul class="hist" id="hist"></ul>
  </section>

  <section class="cartao">
    <h2>Aparelhos salvos</h2>
    <div id="aparelhos" class="suave">Nenhum aparelho salvo.</div>
  </section>

  <section class="cartao">
    <h2>Importar sinal capturado</h2>
    <div class="suave">Cole um .ir do Flipper, Pronto, Broadlink ou “38000: 9000 4500 …”.</div>
    <textarea id="imp"></textarea>
    <div class="linha" style="margin-top:8px"><button id="importar">Importar para o catálogo</button></div>
  </section>
</main>
<div id="msg"></div>
<script>
const T = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
function aviso(txt) { const m = $('msg'); m.textContent = txt; m.style.display = 'block'; clearTimeout(aviso.t); aviso.t = setTimeout(() => m.style.display = 'none', 4000); }
async function api(acao, dados) {
  const r = await fetch('/api/' + acao + '?t=' + encodeURIComponent(T), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dados || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { aviso(j.erro || 'Falhou'); throw new Error(j.erro); }
  return j;
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let arrastando = false;
async function atualizar() {
  let e;
  try { const r = await fetch('/api/estado?t=' + encodeURIComponent(T)); e = await r.json(); if (!r.ok) throw new Error(e.erro); }
  catch (err) { $('t-claude').textContent = 'Servidor sem resposta — o Termux está aberto?'; $('p-claude').className = 'ponto erro'; return; }
  const c = e.claude || {};
  if (c.segundos == null) { $('p-claude').className = 'ponto aviso'; $('t-claude').textContent = 'O Claude ainda não se conectou.'; }
  else { $('p-claude').className = 'ponto ' + (c.segundos < 600 ? 'ok' : 'aviso'); $('t-claude').textContent = 'Claude: último contato há ' + Math.round(c.segundos) + ' s'; }
  $('t-url').textContent = c.url ? 'Túnel ativo em ' + new URL(c.url).hostname + ' (o segredo não aparece aqui)' : 'Túnel ainda não iniciou.';
  const em = e.emissor || {};
  $('p-emissor').className = 'ponto ' + (em.disponivel ? 'ok' : 'erro');
  $('t-emissor').textContent = em.disponivel ? 'Emissor infravermelho pronto' : ('Emissor indisponível: ' + (em.motivo || ''));
  const b = e.busca;
  if (!b) { $('pausar').disabled = true; }
  else {
    const nomes = {executando:'Testando', pausado:'Pausado', lote_concluido:'Lote concluído', concluido:'Todos testados', confirmado:'Resultado confirmado'};
    $('t-busca').textContent = (nomes[b.estado] || b.estado) + ' — ' + b.testados + ' de ' + b.total;
    $('barra').style.width = (b.total ? 100 * b.testados / b.total : 0) + '%';
    $('pausar').disabled = b.estado !== 'executando';
    const a = b.atual;
    $('t-atual').textContent = a ? ('Última tentativa nº ' + a.numero + (a.candidato ? ' (candidato ' + a.candidato + ')' : '') + (a.marcas ? ' · ' + a.marcas.join(', ') : '') + (a.funcao_provavel ? ' · ' + a.funcao_provavel : '') + ' · ' + a.hora) : '';
    if (!arrastando) { $('intervalo').value = b.intervalo; $('t-intervalo').textContent = b.intervalo + ' s'; }
    $('hist').innerHTML = (b.historico || []).map(h => '<li><div class="info"><b>nº ' + h.numero + '</b> ' + esc(h.tipo) + (h.candidato ? ' · cand. ' + h.candidato : '') + (h.marcas ? ' · ' + esc(h.marcas.join(', ')) : '') + (h.funcao_provavel ? ' · ' + esc(h.funcao_provavel) : '') + (h.variante ? ' · variante ' + esc(h.variante) : '') + '<br><span class="suave">' + esc(h.hora) + (h.status === 'erro' ? ' · erro: ' + esc(h.erro) : '') + '</span></div><button data-r="' + h.numero + '">Retestar</button><button data-c="' + h.numero + '">Funcionou</button></li>').join('');
  }
  const aps = e.aparelhos || [];
  $('aparelhos').innerHTML = aps.length ? aps.map(a => '<div style="margin-bottom:12px"><div class="grande" style="color:var(--texto)">' + esc(a.nome) + '</div><div class="teclas">' + a.teclas.slice(0, 18).map(t => '<button data-a="' + esc(a.nome) + '" data-t="' + esc(t.chave) + '">' + esc(t.rotulo) + '</button>').join('') + '</div></div>').join('') : 'Nenhum aparelho salvo.';
}
$('pausar').onclick = async () => { $('pausar').disabled = true; try { await api('pausar', {origem:'painel'}); aviso('Pausado. Conte ao Claude o que aconteceu.'); } catch (e) {} atualizar(); };
$('continuar').onclick = async () => { try { await api('retomar', {}); } catch (e) {} atualizar(); };
$('intervalo').oninput = () => { arrastando = true; $('t-intervalo').textContent = $('intervalo').value + ' s'; };
$('intervalo').onchange = async () => { arrastando = false; try { await api('intervalo', {intervalo: Number($('intervalo').value)}); } catch (e) {} };
document.body.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.dataset.r) { try { await api('retestar', {numero: Number(t.dataset.r)}); aviso('Reenviado nº ' + t.dataset.r); } catch (e) {} }
  else if (t.dataset.c) { try { await api('confirmar', {numero: Number(t.dataset.c)}); aviso('Confirmado nº ' + t.dataset.c + '. Peça ao Claude para salvar.'); } catch (e) {} }
  else if (t.dataset.t) { try { const r = await api('tecla', {aparelho: t.dataset.a, tecla: t.dataset.t}); aviso(r.status === 'sinal_enviado' ? 'Sinal enviado' : (r.erros || r.explicacao || [r.status]).join(' ')); } catch (e) {} }
});
$('importar').onclick = async () => { try { const r = await api('importar', {conteudo: $('imp').value}); aviso('Importado: perfil ' + r.perfil_id + ' com ' + r.comandos + ' comando(s)'); $('imp').value=''; } catch (e) {} };
atualizar(); setInterval(atualizar, 1000);
</script>
</body>
</html>
